name: Validate
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate descriptor and lifecycle
        run: |
          python3 scripts/check.py --require-shellcheck
          shellcheck scripts/verify-upstream.sh
          python3 scripts/build.py --repo "$GITHUB_REPOSITORY"
      - name: Smoke test official Linux AMD64 release
        run: bash scripts/verify-upstream.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unraid-infisical-cli
          path: dist/unraid-infisical-cli.plg
